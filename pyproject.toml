[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cognitive-agent-orchestrator"
version = "1.0.0"
description = "A professional, modular framework for building and orchestrating autonomous AI agents."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
    {name = "Shivay Singh", email = "shivaysinghrajputofficial@gmail.com"}
]
keywords = ["ai", "agents", "orchestration", "llm", "cognitive", "automation"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "aiohttp>=3.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "build",
    "twine"
]

[project.urls]
Homepage = "https://github.com/Shivay00001/cognitive-agent-orchestrator"
Repository = "https://github.com/Shivay00001/cognitive-agent-orchestrator"

[project.scripts]
cognitive-agent = "cognitive_agent_orchestrator.interfaces.cli:main_sync"

[tool.setuptools.packages.find]
include = ["cognitive_agent_orchestrator*"]
